# Reviewed production and native-calibration Cargo dependency closure.
#
# Every direct requirement is exact. Every registry package resolved into
# Cargo.lock is pinned by identity, crates.io source, checksum, license, MSRV,
# and dependency edges. ci/check_workspace_boundaries.py treats this file as a
# fail-closed allowlist; changing any field requires an explicit review.

format = 1
registry_source = "registry+https://github.com/rust-lang/crates.io-index"
workspace_msrv = "1.85"

