name: Native CUDA compile and link

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      cuda_architectures:
        description: Semicolon-separated CMake CUDA architecture list
        required: true
        default: "89"
        type: string

permissions:
  contents: read

jobs:
  python-free-build:
    name: Python-free CUDA AOT and C ABI smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTINFER_CUDA_ARCHITECTURES: ${{ inputs.cuda_architectures || '89' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build pinned CUDA devel image
        run: |
          docker build \
            --file ci/cuda/Dockerfile \
            --build-arg "RUSTINFER_CUDA_ARCHITECTURES=${RUSTINFER_CUDA_ARCHITECTURES}" \
            --progress plain \
            --tag rustinfer-pr02-cuda:ci \
            .
