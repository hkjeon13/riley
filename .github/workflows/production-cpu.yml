name: Production CPU

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.85.0

jobs:
  quality:
    name: Format, lint, test, docs, and boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
          rustc --version | grep -E '^rustc 1\.85\.0 '
          cargo --version | grep -E '^cargo 1\.85\.0 '

      - name: Format
        run: cargo fmt --all -- --check

      - name: Dependency, license, feature, and workspace boundary policy
        run: |
          python3 ci/check_workspace_boundaries.py --locked
          python3 ci/check_extension_gates.py --base-revision "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: Release, performance, and reliability contract tests
        run: |
          python3 -m unittest discover -s ci/tests -p 'test_*.py' -v
          python3 -m unittest discover -s ci/release -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/scripts/tests -p 'test_*.py' -v
          python3 ci/release/verify_runtime_dockerfile.py
          python3 ci/release/verify_reconstructed_runtime_assembly_dockerfile.py
          bash -n ci/run_release_soak.sh
          python3 benchmarks/scripts/validate_contract.py

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings

      - name: Prepare C03 routing-fuzz diagnostic directory
        env:
          RILEY_ROUTING_FUZZ_RECEIPT_DIR: ${{ runner.temp }}/riley-routing-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
        run: install -d -m 700 "$RILEY_ROUTING_FUZZ_RECEIPT_DIR"

      - name: Unit tests
        id: unit_tests
        env:
          RILEY_ROUTING_FUZZ_RECEIPT_DIR: ${{ runner.temp }}/riley-routing-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          RILEY_ROUTING_FUZZ_SOURCE_REVISION: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RILEY_ROUTING_FUZZ_SOURCE_REVISION"
          cargo test --locked --workspace --all-targets --no-default-features

      - name: Validate C03 routing-fuzz diagnostics
        if: failure() && steps.unit_tests.outcome == 'failure'
        env:
          RILEY_ROUTING_FUZZ_RECEIPT_DIR: ${{ runner.temp }}/riley-routing-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          RILEY_ROUTING_FUZZ_SOURCE_REVISION: ${{ github.sha }}
        run: |
          shopt -s nullglob
          receipts=("$RILEY_ROUTING_FUZZ_RECEIPT_DIR"/*.json)
          for receipt in "${receipts[@]}"; do
            python3 benchmarks/scripts/check_routing_fuzz_receipt.py \
              --receipt "$receipt" \
              --expected-source-revision "$RILEY_ROUTING_FUZZ_SOURCE_REVISION"
          done

      - name: Upload C03 routing-fuzz diagnostics
        if: failure() && steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: c03-routing-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/riley-routing-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Python-free synthetic model loading
        run: ci/verify_python_free_model_loading.sh

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --no-default-features

      - name: CPU feature matrix
        run: ci/check_feature_matrix.sh

      - name: Build without excluded tool and research directories
        run: ci/check_workspace_without_research_tools.sh
