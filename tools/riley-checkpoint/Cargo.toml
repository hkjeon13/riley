[package]
name = "riley-checkpoint"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"
description = "Explicit, verified checkpoint preparation outside Riley serving"

[workspace]
resolver = "3"

[features]
default = []
hub = ["dep:hf-hub"]

[dependencies]
riley-model = { path = "../../crates/riley-model", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
hf-hub = { version = "=0.4.3", default-features = false, features = ["ureq"], optional = true }

[dev-dependencies]
serde_json = "=1.0.145"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
