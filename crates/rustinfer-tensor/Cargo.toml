[package]
name = "rustinfer-tensor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Tensor metadata boundary for rustinfer"
readme = "README.md"

[features]
default = []
cuda = ["dep:rustinfer-cuda", "rustinfer-cuda/cuda"]

[dependencies]
rustinfer-core = { path = "../rustinfer-core" }
rustinfer-cuda = { path = "../rustinfer-cuda", optional = true }

[lints]
workspace = true
