[package]
name = "rustinfer-scheduler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Scheduling state boundary for rustinfer"

[features]
default = []
cuda = ["rustinfer-runtime/cuda"]

[dependencies]
rustinfer-core = { path = "../rustinfer-core" }
rustinfer-runtime = { path = "../rustinfer-runtime" }

[dev-dependencies]
rustinfer-model = { path = "../rustinfer-model" }

[lints]
workspace = true

[[test]]
name = "llama_iteration_gpu"
path = "tests/llama_iteration_gpu.rs"
required-features = ["cuda"]
