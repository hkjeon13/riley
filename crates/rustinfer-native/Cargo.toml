[package]
name = "rustinfer-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Development-only native calibration contract owner for rustinfer"
build = "build.rs"

[features]
default = []
cuda = [
    "dep:rustinfer-cuda",
    "dep:rustinfer-model",
    "dep:rustinfer-runtime",
    "rustinfer-cuda/cuda",
    "rustinfer-cuda/nvml",
    "rustinfer-runtime/cuda",
]

[dependencies]
rustinfer-cuda = { path = "../rustinfer-cuda", optional = true }
rustinfer-model = { path = "../rustinfer-model", optional = true }
rustinfer-runtime = { path = "../rustinfer-runtime", optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = { version = "=0.11.0", default-features = false }

[lints]
workspace = true

[[bin]]
name = "rustinfer-native"
path = "src/main.rs"
required-features = ["cuda"]
