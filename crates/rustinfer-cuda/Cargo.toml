[package]
name = "rustinfer-cuda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Narrow Rust boundary for the rustinfer native CUDA C ABI"
build = "build.rs"
links = "rustinfer_cuda_native"

[features]
default = []
cuda = []

[dependencies]
rustinfer-core = { path = "../rustinfer-core" }

[lints]
workspace = true

[[test]]
name = "abi_link"
path = "tests/abi_link.rs"
required-features = ["cuda"]

[[test]]
name = "host_runtime_gpu"
path = "tests/host_runtime_gpu.rs"
required-features = ["cuda"]

[[test]]
name = "memory_gpu"
path = "tests/memory_gpu.rs"
required-features = ["cuda"]

[[test]]
name = "primitives_gpu"
path = "tests/primitives_gpu.rs"
required-features = ["cuda"]

[[test]]
name = "batch_gpu"
path = "tests/batch_gpu.rs"
required-features = ["cuda"]

[[test]]
name = "row_bias_gpu"
path = "tests/row_bias_gpu.rs"
required-features = ["cuda"]

[[test]]
name = "gemm_gpu"
path = "tests/gemm_gpu.rs"
required-features = ["cuda"]

[[test]]
name = "attention_gpu"
path = "tests/attention_gpu.rs"
required-features = ["cuda"]

[[test]]
name = "prefill_attention_gpu"
path = "tests/prefill_attention_gpu.rs"
required-features = ["cuda"]
