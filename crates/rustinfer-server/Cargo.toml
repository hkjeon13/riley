[package]
name = "rustinfer-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Binary and server feature owner for rustinfer"

[features]
default = []
cuda = ["rustinfer-runtime/cuda", "rustinfer-scheduler/cuda"]
server = ["dep:libc", "dep:serde", "dep:serde_json"]
bench = ["dep:serde", "dep:serde_json"]
experimental = []

[dependencies]
rustinfer-core = { path = "../rustinfer-core" }
rustinfer-model = { path = "../rustinfer-model" }
rustinfer-runtime = { path = "../rustinfer-runtime" }
rustinfer-scheduler = { path = "../rustinfer-scheduler" }
libc = { version = "=0.2.189", optional = true }
serde = { version = "=1.0.228", features = ["derive"], optional = true }
serde_json = { version = "=1.0.145", optional = true }

[lints]
workspace = true

[[bin]]
name = "rustinfer"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "rustinfer-profile"
path = "src/bin/rustinfer-profile.rs"
required-features = ["bench", "cuda"]

[[test]]
name = "api_gpu"
path = "tests/api_gpu.rs"
required-features = ["server", "cuda"]
