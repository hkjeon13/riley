[package]
name = "rustinfer-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Binary and server feature owner for rustinfer"

[features]
default = []
cuda = ["rustinfer-runtime/cuda", "rustinfer-scheduler/cuda"]
server = ["dep:serde", "dep:serde_json"]
bench = []
experimental = []

[dependencies]
rustinfer-core = { path = "../rustinfer-core" }
rustinfer-model = { path = "../rustinfer-model" }
rustinfer-runtime = { path = "../rustinfer-runtime" }
rustinfer-scheduler = { path = "../rustinfer-scheduler" }
serde = { version = "=1.0.228", features = ["derive"], optional = true }
serde_json = { version = "=1.0.145", optional = true }

[lints]
workspace = true

[[bin]]
name = "rustinfer"
path = "src/main.rs"
required-features = ["server"]
