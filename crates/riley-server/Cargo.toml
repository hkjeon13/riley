[package]
name = "riley-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Binary and server feature owner for Riley"

[features]
default = []
cuda = ["riley-runtime/cuda", "riley-scheduler/cuda"]
server = [
    "dep:libc",
    "dep:minijinja",
    "dep:minijinja-contrib",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
]
bench = ["dep:serde", "dep:serde_json"]
experimental = []
# Caller-owned BF16 eager numerics; no Torch runtime dependency.
owned-hf-eager = ["cuda", "riley-runtime/cuda-cublas-gemm-probe"]
# Serves the source-bound HF-eager-exact Qwen P2048 cache-on route. It links
# the direct cuBLAS probe and is not part of ordinary CUDA serving builds.
hf-exact-probe = ["cuda", "riley-runtime/cuda-cublas-gemm-probe"]

[dependencies]
riley-core = { path = "../riley-core" }
riley-model = { path = "../riley-model" }
riley-runtime = { path = "../riley-runtime" }
riley-scheduler = { path = "../riley-scheduler" }
libc = { version = "=0.2.189", optional = true }
minijinja = { version = "=3.0.4", features = ["fuel", "json", "loop_controls", "preserve_order", "serde"], optional = true }
minijinja-contrib = { version = "=3.0.4", features = ["pycompat"], optional = true }
serde = { version = "=1.0.228", features = ["derive"], optional = true }
serde_json = { version = "=1.0.145", optional = true }
sha2 = { version = "=0.11.0", default-features = false, optional = true }

[dev-dependencies]
riley-tensor = { path = "../riley-tensor" }

[lints]
workspace = true

[[bin]]
name = "riley"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "riley-profile"
path = "src/bin/riley-profile.rs"
required-features = ["bench", "cuda"]

[[test]]
name = "api_gpu"
path = "tests/api_gpu.rs"
required-features = ["server", "cuda"]

[[test]]
name = "qwen3b_native_d128_trace_gpu"
path = "tests/qwen3b_native_d128_trace_gpu.rs"
required-features = ["server", "cuda"]

[[test]]
name = "qwen3b_p2051_layer_stage_gpu"
path = "tests/qwen3b_p2051_layer_stage_gpu.rs"
required-features = ["server", "cuda"]

[[test]]
name = "qwen3b_ordinary_c1_own_chosen128_logit_trace_gpu"
path = "tests/qwen3b_ordinary_c1_own_chosen128_logit_trace_gpu.rs"
required-features = ["server", "cuda"]

[[test]]
name = "qwen3b_http_hf_exact_c1_gpu"
path = "tests/qwen3b_http_hf_exact_c1_gpu.rs"
required-features = ["server", "hf-exact-probe"]
