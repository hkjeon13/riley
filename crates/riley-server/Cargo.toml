[package]
name = "riley-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Binary and server feature owner for Riley"

[features]
default = []
cuda = ["riley-runtime/cuda", "riley-scheduler/cuda"]
server = ["dep:libc", "dep:serde", "dep:serde_json", "dep:sha2"]
bench = ["dep:serde", "dep:serde_json"]
experimental = []

[dependencies]
riley-core = { path = "../riley-core" }
riley-model = { path = "../riley-model" }
riley-runtime = { path = "../riley-runtime" }
riley-scheduler = { path = "../riley-scheduler" }
libc = { version = "=0.2.189", optional = true }
serde = { version = "=1.0.228", features = ["derive"], optional = true }
serde_json = { version = "=1.0.145", optional = true }
sha2 = { version = "=0.11.0", default-features = false, optional = true }

[lints]
workspace = true

[[bin]]
name = "riley"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "riley-profile"
path = "src/bin/riley-profile.rs"
required-features = ["bench", "cuda"]

[[test]]
name = "api_gpu"
path = "tests/api_gpu.rs"
required-features = ["server", "cuda"]
