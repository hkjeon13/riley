[package]
name = "riley-cuda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Narrow Rust boundary for the Riley native CUDA C ABI"
build = "build.rs"
links = "riley_cuda_native"

[features]
default = []
cuda = []
# Development/calibration-only in-process NVIDIA Management Library probe.
# Keep this separate so ordinary CUDA production binaries do not acquire an
# NVML DT_NEEDED dependency.
nvml = ["cuda"]
# Test infrastructure only. This deliberately changes the native archive and
# must never be enabled in a production build.
cuda-test-fault-injection = ["cuda"]
# Test-only native cuBLAS BF16 GEMM descriptor probe. Ordinary CUDA builds
# intentionally do not link libcuBLAS.
cuda-cublas-gemm-probe = ["cuda"]

[dependencies]
riley-core = { path = "../riley-core" }

[dev-dependencies]
serde_json = "=1.0.145"
sha2 = { version = "=0.11.0", default-features = false }

[lints]
workspace = true

[[test]]
name = "abi_link"
path = "tests/abi_link.rs"
required-features = ["cuda"]

