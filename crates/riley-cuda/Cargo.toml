[package]
name = "riley-cuda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Narrow Rust boundary for the Riley native CUDA C ABI"
build = "build.rs"
links = "riley_cuda_native"

[features]
default = []
cuda = []
# Development/calibration-only in-process NVIDIA Management Library probe.
# Keep this separate so ordinary CUDA production binaries do not acquire an
# NVML DT_NEEDED dependency.
nvml = ["cuda"]
# Test infrastructure only. This deliberately changes the native archive and
# must never be enabled in a production build.
cuda-test-fault-injection = ["cuda"]

[dependencies]
riley-core = { path = "../riley-core" }

[lints]
workspace = true

[[test]]
name = "abi_link"
path = "tests/abi_link.rs"
required-features = ["cuda"]

[[test]]
name = "host_runtime_gpu"
path = "tests/host_runtime_gpu.rs"
required-features = ["cuda"]

[[test]]
name = "nvml_gpu"
path = "tests/nvml_gpu.rs"
required-features = ["nvml"]

[[test]]
name = "memory_gpu"
path = "tests/memory_gpu.rs"
required-features = ["cuda"]

[[test]]
name = "memory_fault_injection_gpu"
path = "tests/memory_fault_injection_gpu.rs"
required-features = ["cuda-test-fault-injection"]

[[test]]
name = "primitives_gpu"
path = "tests/primitives_gpu.rs"
required-features = ["cuda"]

[[test]]
name = "batch_gpu"
path = "tests/batch_gpu.rs"
required-features = ["cuda"]

[[test]]
name = "row_bias_gpu"
path = "tests/row_bias_gpu.rs"
required-features = ["cuda"]

[[test]]
name = "gemm_gpu"
path = "tests/gemm_gpu.rs"
required-features = ["cuda"]

[[test]]
name = "fixed37_gpu"
path = "tests/fixed37_gpu.rs"
required-features = ["cuda"]

[[test]]
name = "fixed37_attention_gpu"
path = "tests/fixed37_attention_gpu.rs"
required-features = ["cuda"]

[[test]]
name = "fixed37_decode_attention_gpu"
path = "tests/fixed37_decode_attention_gpu.rs"
required-features = ["cuda"]

[[test]]
name = "attention_gpu"
path = "tests/attention_gpu.rs"
required-features = ["cuda"]

[[test]]
name = "prefill_attention_gpu"
path = "tests/prefill_attention_gpu.rs"
required-features = ["cuda"]

[[test]]
name = "hf_prefill_attention_exact_gpu"
path = "tests/hf_prefill_attention_exact_gpu.rs"
required-features = ["cuda"]
