[package]
name = "riley-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Model and backend orchestration boundary for Riley"

[features]
default = []
cuda = ["dep:riley-cuda", "riley-cuda/cuda", "riley-tensor/cuda"]
# Diagnostic-only direct cuBLAS raw-projection qualifier. This forwards the
# isolated native probe feature and is deliberately not part of ordinary CUDA
# serving builds.
cuda-cublas-gemm-probe = ["cuda", "riley-cuda/cuda-cublas-gemm-probe"]

[dependencies]
riley-core = { path = "../riley-core" }
riley-cuda = { path = "../riley-cuda", optional = true }
riley-model = { path = "../riley-model" }
riley-tensor = { path = "../riley-tensor" }
sha2 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
syn = { version = "=2.0.119", features = ["full", "visit"] }
riley-cuda = { path = "../riley-cuda" }
serde_json = "=1.0.145"

[lints]
workspace = true

[[test]]
name = "cuda_weights_gpu"
path = "tests/cuda_weights_gpu.rs"
required-features = ["cuda"]

