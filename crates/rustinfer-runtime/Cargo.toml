[package]
name = "rustinfer-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Model and backend orchestration boundary for rustinfer"

[features]
default = []
cuda = ["dep:rustinfer-cuda", "rustinfer-cuda/cuda", "rustinfer-tensor/cuda"]

[dependencies]
rustinfer-core = { path = "../rustinfer-core" }
rustinfer-cuda = { path = "../rustinfer-cuda", optional = true }
rustinfer-model = { path = "../rustinfer-model" }
rustinfer-tensor = { path = "../rustinfer-tensor" }
sha2 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
rustinfer-cuda = { path = "../rustinfer-cuda" }
serde_json = "=1.0.145"

[lints]
workspace = true

[[test]]
name = "cuda_weights_gpu"
path = "tests/cuda_weights_gpu.rs"
required-features = ["cuda"]

[[test]]
name = "llama_forward_gpu"
path = "tests/llama_forward_gpu.rs"
required-features = ["cuda"]

[[test]]
name = "llama_decode_gpu"
path = "tests/llama_decode_gpu.rs"
required-features = ["cuda"]

[[test]]
name = "llama_generation_gpu"
path = "tests/llama_generation_gpu.rs"
required-features = ["cuda"]
